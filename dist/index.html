<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=dev duration-500ice-width, initial-scale=1.0">
    <title>Space duration-500 Travel</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-slate-950 text-white font-body p-8">
    <main class="max-w-7xl min-h-dvh bg-white/5 rounded-3xl p-4 mx-auto border border-white/15">
        <header class="flex flex-col items-center justify-between gap-4 lg:flex-row">
            <h1 class="font-title text-4xl font-bold leading-tight md:text-5xl">Space Travel</h1>
            <figure class="flex gap-1">
                <img src="./images/astro01.jpg" alt="Astrounauta 1"
                    class="size-10 rounded-full border-2 border-cyan-950 object-cover-cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro02.jpg" alt="Astrounauta 2"
                    class="size-10 rounded-full border-2 border-cyan-950 object-cover-cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro03.jpg" alt="Astrounauta 3"
                    class="size-10 rounded-full border-2 border-cyan-950 object-cover-cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro04.jpg" alt="Astrounauta 4"
                    class="size-10 rounded-full border-2 border-cyan-950 object-cover-cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro05.jpg" alt="Astrounauta 5"
                    class="size-10 rounded-full border-2 border-cyan-950 object-cover-cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro06.jpg" alt="Astrounauta 6"
                    class="size-10 rounded-full border-2 border-cyan-950 object-cover-cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro07.jpg" alt="Astrounauta 7"
                    class="size-10 rounded-full border-2 border-cyan-950 object-cover-cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro08.jpg" alt="Astrounauta 8"
                    class="size-10 rounded-full border-2 border-cyan-950 object-cover-cursor-pointer hover:animate-spin duration-500">
            </figure>
        </header>
        <form name="form-viagem" id="form-viagem" method="get" action="">
            <p class="my-5 font-medium text-cyan-300 text-center text-balance">
                Preencha os dados abaixo para confirmar sua viagem especial
            </p>

            <fieldset class="border border-white/10 rounded-2xl bg-white/10 p-4">
                <legend class="text-cyan-300 px-2 font-title text-lg font-bold">01. Dados do viajante</legend>
                <section class="grid gap-6 lg:grid-cols-2 md:grid-cols-2">
                    <div>
                        <label for="nome" class="block ml-2 text-sm mb-2 text-slate-300 ">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Digite seu nome" minlength="10" maxlength="30"
                            required
                            class="border border-white/10 bg-slate-950/60 px-2 py-3 outline-none focus:bg-white/10 focus:border-cyan-400 w-full rounded-lg">
                    </div>
                    <div>
                        <label for="codigo" class="block ml-2 text-sm mb-2 text-slate-300 ">Código de acesso</label>
                        <input type="text" id="codigo" placeholder="Digite seu Ccódigo" minlength="10" maxlength="30"
                            required
                            class="border border-white/10 bg-slate-950/60 px-2 py-3 outline-none focus:bg-white/10 focus:border-cyan-400 w-full rounded-lg">
                    </div>
                    <div>
                        <label for="dataviagem" class="block ml-2 text-sm mb-2 text-slate-300 ">Data da viagem</label>
                        <input type="date" id="dataViagem"
                            class="border border-white/10 bg-slate-950/60 px-2 py-3 outline-none focus:bg-white/10 focus:border-cyan-400 w-full rounded-lg">
                    </div>
                    <div>
                        <label for="email" class="block ml-2 text-sm mb-2 text-slate-300 ">Email</label>
                        <input type="email" id="email" placeholder="Digite o seu email" class="border border-white/10 bg-slate-950/60 px-2 py-3 outline-none
                         focus:bg-white/10 focus:border-cyan-400 w-full rounded-lg">
                    </div>
                </section>
            </fieldset>



            <fieldset class="border border-white/10 rounded-2xl bg-white/10 p-4">
                <legend class="text-cyan-300 px-2 font-title text-lg font-bold">02. Detalhes da viagem</legend>
                <section class="grid gap-6 lg:grid-cols-2 md:grid-cols-2">
                    <div>
                        <label for="destino" class="block ml-2 text-sm mb-2 text-slate-300 ">Destino</label>
                        <select name="destino" id="destino" required
                            class="border border-white/10 bg-slate-950 px-2 py-3 outline-none focus:border-cyan-400 w-full rounded-lg">
                            <option value="" disabled selected>Selecione um destino</option>
                            <option value="Lua">Lua</option>
                            <option value="Marte">Marte</option>
                            <option value="Titan">Titan</option>
                            <option value="Europa">Europa</option>
                        </select>
                    </div>
                    <div>
                        <label for="nave" class="block-2 text-sm mb-2 text-slate-300">Nave preferida</label>
                        <input type="text" id="nave" list="listNaves" name="nave" class="border border-white/10 bg-slate-950/60 px-2 py-3 outline-none
                         focus:bg-white/10 focus:border-cyan-400 w-full rounded-lg"
                            placeholder="Escolha ou digite uma nave">

                        <datalist id="listNaves">
                            <option value="Orion Gx"></option>
                            <option value="Galaxy Explorer"></option>
                            <option value="Star Voyager"></option>
                            <option value="Cosmos 3000"></option>
                            <option value="Zenith 8000"></option>
                            <option value="Open Space"></option>
                        </datalist>
                    </div>
                </section>
            </fieldset>

        </form>
    </main>
</body>

</html>
